<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galeri — Sevsix 7.6</title>
    <meta name="description" content="Semua foto kegiatan kelas 7.6 SMP Negeri 25 Depok. Bisa diunduh dengan resolusi asli." />
    <meta name="theme-color" content="#0b2a5b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231d4ed8'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='32' font-weight='bold' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body class="page-gallery">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <span class="brand-mark">S</span>
          <span class="brand-text">
            <strong>Sevsix</strong>
            <small>Kelas 7.6</small>
          </span>
        </a>
        <a class="btn btn-soft btn-sm" href="/">← Kembali ke beranda</a>
      </div>
    </header>

    <main class="section gallery-page">
      <div class="container">
        <div class="section-head gallery-page-head">
          <div>
            <span class="eyebrow">Galeri kelas</span>
            <h2>Semua momen Sevsix</h2>
            <p class="section-desc">Klik foto untuk melihat lebih besar, lalu unduh dengan resolusi asli.</p>
            <p class="gallery-count" id="gpCount"></p>
          </div>
          <a class="btn btn-primary" id="gpZip" href="/api/gallery/zip" hidden>Unduh semua (ZIP)</a>
        </div>

        <div class="gallery-grid" id="gpGrid"></div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="brand brand-footer">
          <span class="brand-mark">S</span>
          <span class="brand-text">
            <strong>Sevsix</strong>
            <small>Kelas 7.6</small>
          </span>
        </div>
        <a class="btn btn-ghost btn-sm" href="/">Kembali ke beranda</a>
      </div>
    </footer>

    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" type="button" data-lb-close aria-label="Tutup">×</button>
      <button class="lightbox-nav prev" type="button" data-lb-prev aria-label="Foto sebelumnya">‹</button>
      <button class="lightbox-nav next" type="button" data-lb-next aria-label="Foto berikutnya">›</button>
      <figure>
        <img id="lbImg" alt="" />
        <figcaption id="lbCaption"></figcaption>
        <div class="lightbox-actions">
          <a class="btn btn-soft btn-sm" id="lbDownload" href="#" hidden>Unduh foto</a>
          <span class="lightbox-counter" id="lbCounter"></span>
        </div>
      </figure>
    </div>

    <script src="/galeri.js" defer></script>
  </body>
</html>
